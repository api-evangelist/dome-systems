aid: dome-systems
name: Dome Systems
description: >-
  Dome Systems is the enterprise agentic operations platform — the system of control for
  the agent era. Founded in 2024 by Dave McJannet (former HashiCorp CEO) and Marc Holmes,
  and backed by Redpoint Ventures, Bessemer Venture Partners, and Mango Capital, Dome
  registers every AI agent, governs every tool and model call against policy, and produces
  an immutable audit trail across the estate — regardless of runtime, cloud, or who built
  the agent. The Dome Platform is three control points — Registry (code), Gateway (tools),
  and Broker (models) — on a control plane of Cedar-based Authorization and Audit,
  administered through Go and Python SDKs, a REST API, a CLI, and a built-in MCP surface
  that exposes Dome itself to AI assistants.
